<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f8fd" />
  <title>Журнал хифза</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/views.css" />
</head>
<body>
  <!-- фоновые слои -->
  <div class="bg-wash"></div>
  <div class="bg-glow"></div>
  <div class="bg-pattern"></div>

  <!-- шапка -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" data-action="home" title="На главную">
        <span class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            <path d="M9 7h7M9 11h5" />
          </svg>
        </span>
        <span>
          <b>Журнал хифза</b>
          <small>by Synthetix Lab (kosh) with KoranVdom</small>
        </span>
      </div>

      <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
      <div class="top-actions" id="topActions"></div>
    </div>
  </header>

  <!-- контент -->
  <main id="main"></main>

  <footer>
    <span class="credit">by Synthetix Lab (kosh) with KoranVdom</span>
  </footer>

  <!-- панель массовых действий -->
  <div id="bulkBar" class="bulk-bar hidden">
    <span id="bulkCount"></span>
    <button class="btn primary sm" data-action="bulk-bar-solid">Твёрдо</button>
    <button class="btn outline-danger sm" data-action="bulk-bar-errors">С ошибками</button>
    <button class="btn ghost sm" data-action="bulk-bar-clear">Снять</button>
  </div>

  <!-- служебные контейнеры -->
  <div id="toasts" aria-live="polite"></div>
  <div id="drawerRoot"></div>
  <div id="modalRoot"></div>
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <input type="file" id="importFile" accept=".json,application/json" class="hidden" />

  <script type="module" src="./js/main.js"></script>
</body>
              </html>
